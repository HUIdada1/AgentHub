# 号池管家 + Docker 形态 CI：保留能力的离线自测（Node 22，与发版同基座）。
# 原 Gateway CI（Docker 形态网关）随「反代网关」模块停止维护一并下线；
# 2026-11 Docker 版恢复后本流水线扩展为双轨：
#   ① 号池管家自测（凭据加密、渠道适配契约、签到与到期口径、号池页交互契约）
#   ② Docker 形态自测（依赖闭包 + headless 冒烟：四模块装配 / 命令门控 / Web UI 挂载 / 优雅停机）
# 所有脚本纯 Node、不联网、不消耗额度。
# Docker 镜像**构建与推送**不在本流水线：由 .github/workflows/docker.yml 负责
#（v* tag 或手动触发 → GHCR，并在其中跑容器冒烟 A/B/C 三态断言）。
# 本流水线只承担"没有 Docker 也能跑"的那部分：依赖闭包、第三方裸名、纯净探测、
# 一致性门禁与 headless 冒烟 —— 即 npm run verify:gateway 的全部内容。

name: Pool + Docker CI

on:
  push:
    paths: &ciPaths
      - 'electron/backend/**'
      - 'src/**'
      - 'tools/proxy-*.cjs'
      - 'tools/gateway-*.cjs'
      # 一致性门禁本体与 npm 脚本：只改这两处也必须触发，否则"改了门禁但没人跑它"
      # （tools/gateway-*.cjs 匹配不到 tools/verify/**，package.json 同理不在列）
      - 'tools/verify/**'
      - 'tools/doc-anchors-check.cjs'
      - 'package.json'
      - 'gateway/**'
      - '.github/workflows/pool-ci.yml'
  pull_request:
    paths: *ciPaths
  workflow_dispatch:


concurrency:
  group: pool-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm

      - name: 安装运行时依赖（lock 与 package.json 漂移时退回 install）
        run: npm ci --omit=dev || npm install --omit=dev --no-audit --no-fund

      - name: 共享核心自测（纯 Node 基座）
        shell: bash
        run: |
          set -euo pipefail
          # 每个脚本独立沙箱：任何一个脚本都不允许读写真实用户数据
          run_sbx() {
            local t="$1"; shift
            echo "=== $t ==="
            AGENTHUB_DATA_DIR="$(mktemp -d)" AGENT_SKILLS_HOME="$(mktemp -d)" node "$t" "$@"
          }
          # 凭据信封：DPAPI 替代实现与密文格式
          run_sbx tools/proxy-crypto-envelope-selftest.cjs
          # 渠道适配器契约（登录 / 刷新 / 余额 / 模型目录的返回形状）
          run_sbx tools/proxy-adapter-contract-selftest.cjs
          # ModelScope：签到 / 点赞只读契约与到账确认结构（不调用 checkin，零公开副作用）
          run_sbx tools/proxy-modelscope-selftest.cjs
          # 到期口径回归：adapter 明确 0 / 缺省 / 已到期复活锚点 / 无到期可选
          run_sbx tools/proxy-credits-expiry-selftest.cjs
          # 新渠道（Accio 双区 / CodeArts / Loomy）纯函数自测
          run_sbx tools/proxy-channels-selftest.cjs
          # 自动签到：计划判定与抖动（跨午夜 / 不补欠账 / 已完成）
          run_sbx tools/proxy-checkin-auto-selftest.cjs
          # 号池页渠道切换的源码契约（收起 / 展开形态、图标单一来源、定高与横向滚动约束）
          run_sbx tools/proxy-agents-switch-selftest.cjs

      - name: 文档锚点自检（活文档里的每个 文件:行号 必须与磁盘一致）
        shell: bash
        run: |
          set -euo pipefail
          # 先跑 --self-test：证明这个工具自己判得红（五类合成用例），
          # 否则一个"永远返回 0"的检查器挂在这里只会给人虚假的安全感
          node tools/doc-anchors-check.cjs --self-test
          # 再扫真文档：只扫活的说明书（gateway/README、根 README、deploy/**），
          # 刻意**不扫** docs/docker-上线/ —— 那是带日期的方案快照，行号按设计会随代码漂移，
          # 纳进来会让这条检查长期红，而长期红的门禁等于没有门禁。
          # 放这条流水线而不是 verify:gateway：锚点漂移属文档卫生，
          # 不该阻塞开发者本机那条"改代码就跑"的验证链。
          node tools/doc-anchors-check.cjs

      - name: Docker 形态门禁与冒烟（与本机同一条链，不另列清单）

        shell: bash
        run: |
          set -euo pipefail
          # 刻意**只调 npm run verify:gateway**，不在这里逐条重列脚本：
          # 上一版这里手写了两条（闭包 + 冒烟），于是后来新增的纯净探测第二发、
          # 一致性门禁 T3/T4/T6/T9 全都不会在 CI 里跑 —— 本机绿、CI 漏检，正是
          # "同一件事两份真值"的必然结果。清单只存在于 package.json 的那一行里。
          # 端口不再固定 19527/19528：冒烟自己向系统要随机空闲端口（可并发跑）。
          AGENTHUB_ALLOW_PLAINTEXT=1 AGENTHUB_SECRET_KEY="" AGENTHUB_DATA_DIR="$(mktemp -d)" \
            AGENTHUB_HOST=127.0.0.1 \
            npm run verify:gateway


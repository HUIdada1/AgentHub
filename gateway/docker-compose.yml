# AgentHub Docker 部署（headless：号池管家 + 本地网关双模块）
#
# 启动（在仓库根执行）：
#   AGENTHUB_SECRET_KEY=$(openssl rand -base64 32) docker compose -f gateway/docker-compose.yml up -d --build
# 网关：http://<主机>:9527/v1 （OpenAI / Anthropic / Responses 三协议兼容，由本地网关承接）
# 管理：http://127.0.0.1:9528/api （默认只绑宿主本机；远程管理请前置带 TLS 的反向代理）
#
# 账号从哪来（两条路，详见 gateway/README.md）：
#   ① 配同一个 WebDAV/S3：PUT /api/config/webdav 写入后号池自动同步（推荐，桌面版↔容器互联）
#   ② POST /api/accounts/import 导入 JSON（桌面版导出的快照或手工凭据）
# 注意：与桌面版共用同一个数据卷拿不到凭据——桌面凭据是 safeStorage 密文，容器解不开
#
# 环境变量：
#   AGENTHUB_SECRET_KEY    凭据加密密钥（必填；未设置时入口拒绝启动）
#   AGENTHUB_ADMIN_TOKEN   管理 API 鉴权令牌（未设置时管理面只绑容器回环）
#   TZ                     业务时区（签到时刻与日额度重置按本地时间计算）

services:
  agenthub-gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
      args:
        # 国内直连官方源易超时：export NPM_REGISTRY=https://registry.npmmirror.com 后再 up --build
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: agenthub-gateway:local
    container_name: agenthub-gateway
    restart: unless-stopped
    ports:
      - "${AGENTHUB_PROXY_PORT:-9527}:${AGENTHUB_PROXY_PORT:-9527}"                 # 本地网关（客户端连接）
      - "127.0.0.1:${AGENTHUB_ADMIN_PORT:-9528}:${AGENTHUB_ADMIN_PORT:-9528}"     # 管理 API 默认只绑宿主本机
    environment:
      AGENTHUB_SECRET_KEY: ${AGENTHUB_SECRET_KEY:?必须先设置（openssl rand -base64 32）}
      AGENTHUB_ADMIN_TOKEN: ${AGENTHUB_ADMIN_TOKEN:-}
      # 只读令牌（可选）：日常监视/看板专用，只能看不能改
      AGENTHUB_ADMIN_READONLY_TOKEN: ${AGENTHUB_ADMIN_READONLY_TOKEN:-}
      AGENTHUB_PROXY_PORT: ${AGENTHUB_PROXY_PORT:-9527}
      AGENTHUB_ADMIN_PORT: ${AGENTHUB_ADMIN_PORT:-9528}
      AGENTHUB_HOST: 0.0.0.0
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 独立数据目录：先 mkdir -p gateway-data && sudo chown 1000:1000 gateway-data
      - ../gateway-data:/data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits: { memory: 512M }
